    <main><h1>Contacto</h1>
    
    <form action="#" method="post">
<label for="nombre">Ingresar Nombre Completo</label>
<input type="text" id="nombre" name="nombre" required>

<label for="numero">Ingresar numero de telefono</label>
<input type="tel" id="numero" name="numero" required>

<label for="email">Ingresar correo electronico</label>
<input type="email" id="email" name="email" required>

<label for="motivo">Motivo de consulta</label>
<select name="motivo" id="motivo" required>
<option value="" disabled selected>Elige una opcion</option>
<option value="Reembolso_cambio">Quiero reembolsar mi pasaje o cambiarlo</option>
<option value="Error_pasaje">Tengo problemas con mi pasaje</option>
<option value="Error_web">Tengo problemas con el sitio web</option>
<option value="Error_pagos">Tengo problemas con mi pago</option>
<option value="Otro"> Otro tipo de problema</option>
</select>

<label for="mensaje">Mensaje</label>

<input type="text" id="mensaje" name="mensaje " required>
<button type="submit"> Enviar</button>
<button type="reset"> Cancelar</button>
    </form>
    
    </main>
