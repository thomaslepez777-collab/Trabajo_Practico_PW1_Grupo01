<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ArJet - Vuelos Disponibles</title>
    <link rel="stylesheet" href="styles-pages.css">
</head>
<body>
    <header>
        <img src="../Images/LOGO-nombre.jpeg" alt="Logotipo de ArJet">
        <nav>
            <a href="../index.html">Inicio</a> 
            <a href="Vuelos.html">Vuelos</a>
            <a href="Ofertas.html">Ofertas</a>
            <a href="Contacto.html">Contacto</a>
        </nav>
    </header>

    <main>
        <h1>Resultados de búsqueda</h1>
        <section class="filtros-vuelo">
            <h3>Filtros</h3>
            <details>
                <summary>Precio</summary>
                <input type="range" min="100" max="5000">
            </details>
            <details>
                <summary>Tipo de vuelo</summary>
                <input type="checkbox" id="directo"> <label for="directo">Directo</label>
                <input type="checkbox" id="escalas"> <label for="escalas">Con escalas</label>
            </details>
        </section>

        <section class="lista-vuelos">
            <article>
                <p>Buenos Aires - Madrid</p>
                <p>Precio: $1200</p>
                <a href="DetalleVuelo.html">Ver detalle</a>
            </article>
        </section>
    </main>

    <footer>
        <div class="footer-container">
            <div class="footer-col">
                <img src="../Images/LOGO-a.jpeg" alt="Logo de ArJet">
                <h2>ArJet</h2>
                <nav>
                    <a href="SobreNosotros.html">Sobre Nosotros</a>
                    <a href="PoliticaDePrivacidad.html">Política de privacidad</a>
                    <a href="PreguntasFrecuentes.html">Preguntas frecuentes</a>
                </nav>
            </div>
            <div class="footer-col">
                <h2>Enlaces</h2>
                <nav>
                    <a href="../index.html">Inicio</a>
                    <a href="Vuelos.html">Vuelos</a>
                    <a href="Ofertas.html">Ofertas</a>
                </nav>
            </div>
        </div>
    </footer>
</body>
</html>
