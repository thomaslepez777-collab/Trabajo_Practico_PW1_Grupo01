<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ArJet - Finalizar Compra</title>
    <link rel="stylesheet" href="styles-pages.css">
</head>
<body>
    <header>
        <img src="../Images/LOGO-nombre.jpeg" alt="Logotipo de ArJet">
        <nav>
            <a href="../index.html">Inicio</a> 
            <a href="Vuelos.html">Vuelos</a>
            <a href="Ofertas.html">Ofertas</a>
            <a href="Contacto.html">Contacto</a>
        </nav>
    </header>

    <main>
        <h1>Finalizar Compra</h1>
        <form action="MisReservas.html" method="POST">
            <fieldset>
                <legend>Datos del Pasajero</legend>
                <label for="nombre">Nombre Completo</label>
                <input type="text" id="nombre" required>
                
                <label for="dni">Documento / Pasaporte</label>
                <input type="number" id="dni" required>
                
                <label for="email">Correo Electrónico</label>
                <input type="email" id="email" required>
            </fieldset>

            <fieldset>
                <legend>Método de Pago</legend>
                <input type="radio" id="tarjeta" name="pago" checked>
                <label for="tarjeta">Tarjeta de Crédito</label>
                
                <input type="radio" id="paypal" name="pago">
                <label for="paypal">PayPal</label>
                
                <input type="radio" id="transferencia" name="pago">
                <label for="transferencia">Transferencia Bancaria</label>
            </fieldset>

            <section class="resumen-vuelo">
                <h3>Resumen</h3>
                <p>Vuelo: EZE - MAD</p>
                <p>Total: $1.200 USD</p>
                <input type="text" placeholder="Código de descuento">
            </section>

            <button type="submit">Confirmar Reserva</button>
        </form>
    </main>
</body>
</html>
