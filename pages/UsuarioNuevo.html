    <main>
        <a href="Usuario.html" class="btn-volver">← Volver</a>
        <h1>Registrarse</h1>
        <form action="../logueado_index.html" method="get">
            <label for="nombre">Nombre Completo</label>
            <input type="text" id="nombre" name="nombre" required placeholder="Ej: Juan Pérez">

            <label for="nacionalidad">Nacionalidad</label>
            <input type="text" id="nacionalidad" name="nacionalidad" required placeholder="Ej: Argentina">

            <label for="dni">Número de Documento</label>
            <input type="text" inputmode="numeric" pattern="[0-9]*" id="dni" name="dni" required
                placeholder="Solo números">

            <label for="numero">Número de teléfono</label>
            <input type="tel" id="numero" name="numero" required placeholder="Ej: +54...">

            <label for="email">Correo electrónico</label>
            <input type="email" id="email" name="email" required placeholder="usuario@email.com">

            <div class="botones-usuario">
                <button type="submit">Crear Cuenta</button>
                <button type="reset">Borrar</button>
            </div>
        </form>
    </main>
