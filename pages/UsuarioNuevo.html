<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ArJet - Crear Cuenta</title>
    <link rel="stylesheet" href="styles-usuario.css">
</head>
<body>
    <header>
        <img src="../Images/arjet_logo_transparente.png" alt="Logotipo de ArJet">
        <nav>
            <a href="../index.html">Inicio</a>
            <a href="Usuario.html">Iniciar sesion</a>
            <a href="Vuelos.html">Vuelos</a>
            <a href="Ofertas.html">Ofertas</a>
            <a href="MisReservas.html">Mis Reservas</a>
            <a href="Contacto.html">Contacto</a>
        </nav>
    </header>

    <main>
        <h1>Registrarse</h1>
        <form action="#" method="POST">
            <label for="nombre">Nombre Completo</label>
            <input type="text" id="nombre" name="nombre" required placeholder="Ej: Juan Pérez">

            <label for="nacionalidad">Nacionalidad</label>
            <input type="text" id="nacionalidad" name="nacionalidad" required placeholder="Ej: Argentina">

            <label for="dni">Número de Documento</label>
            <input type="text" inputmode="numeric" pattern="[0-9]*" id="dni" name="dni" required placeholder="Solo números">

            <label for="numero">Número de teléfono</label>
            <input type="tel" id="numero" name="numero" required placeholder="Ej: +54...">

            <label for="email">Correo electrónico</label>
            <input type="email" id="email" name="email" required placeholder="usuario@email.com">

            <div class="botones-usuario">
                <button type="submit">Crear Cuenta</button>
                <button type="reset">Cancelar</button>
            </div>
        </form>
    </main>

    <footer>
        <div class="footer-container">
            <div class="footer-col">
                <img src="../Images/LOGO-a.jpeg" alt="Logo de ArJet" class="footer-logo">
                <h2>ArJet</h2>
                <nav>
                    <a href="SobreNosotros.html">Sobre Nosotros</a>
                    <a href="PoliticaDePrivacidad.html">Política de privacidad</a>
                    <a href="PreguntasFrecuentes.html">Preguntas frecuentes</a>
                </nav>
            </div>
            <div class="footer-col">
                <h2>Enlaces</h2>
                <nav>
                    <a href="../index.html">Inicio</a>
                    <a href="Vuelos.html">Vuelos</a>
                    <a href="Ofertas.html">Ofertas</a>
                </nav>
            </div>
            <div class="footer-col">
                <h2>Síguenos</h2>
                <nav>
                    <a href="../redes-sociales/instagram.html">Instagram</a>
                    <a href="../redes-sociales/facebook.html">Facebook</a>
                    <a href="../redes-sociales/red-soc-x.html">X</a>
                    <a href="../redes-sociales/tiktok.html">Tik-Tok</a>
                </nav>
            </div>
        </div>
    </footer>
</body>
</html>
